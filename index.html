
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CART3R NIGHTMARE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#030000;color:red;
 font-family:monospace;text-align:center;
 min-height:100vh;display:grid;place-items:center;
 overflow:hidden;
}
#app{padding:25px;width:100%;max-width:500px}
h1{font-size:35px;text-shadow:0 0 20px red}
#status{margin:30px 0;color:#ff7777}
#bar{height:12px;border:1px solid red}
#fill{height:100%;width:0;background:red;box-shadow:0 0 15px red}
#count{font-size:75px}
button{
 background:#300000;color:white;border:1px solid red;
 padding:16px;margin:15px;font-size:16px;
}
#scare{
 display:none;position:fixed;inset:0;
 background:radial-gradient(circle,#850000,#000);
 z-index:5;align-items:center;justify-content:center;
 flex-direction:column;animation:flash .12s infinite alternate;
}
.face{font-size:150px;filter:drop-shadow(0 0 25px red)}
#scare h1{font-size:42px;color:white}
@keyframes flash{
 from{filter:brightness(.6)}
 to{filter:brightness(1.7)}
}
</style>
</head>
<body>
<div id="app">
 <h1>CART3R.JAILBREAK</h1>
 <p>NIGHTMARE MODE // ACTIVATED</p>
 <div id="status">SISTEMA IN ATTESA...</div>
 <div id="bar"><div id="fill"></div></div>
 <p id="percent">SCANSIONE: 0%</p>
 <div id="count"></div>
 <button id="start">AVVIA SIMULAZIONE</button>
</div>

<div id="scare">
 <div class="face">👹</div>
 <h1>TI HO TROVATO.</h1>
 <button onclick="location.reload()">RIPROVA</button>
</div>

<script>
const status=document.getElementById("status");
const fill=document.getElementById("fill");
const percent=document.getElementById("percent");
const count=document.getElementById("count");
const scare=document.getElementById("scare");

function beep(f,d){
 const ctx=new AudioContext();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.type="sawtooth";
 o.frequency.value=f;
 g.gain.value=.12;
 o.connect(g);g.connect(ctx.destination);
 o.start();
 o.stop(ctx.currentTime+d);
 o.onended=()=>ctx.close();
}

document.getElementById("start").onclick=async()=>{
 status.innerText="ACCESSO NON AUTORIZZATO";
 beep(500,.4);

 for(let i=0;i<=99;i+=3){
  fill.style.width=i+"%";
  percent.innerText="SCANSIONE: "+i+"%";
  if(i>60)status.innerText="ERRORE CRITICO";
  await new Promise(r=>setTimeout(r,100));
 }

 percent.innerText="SCANSIONE: 99%";
 status.innerText="SISTEMA BLOCCATO";
 await new Promise(r=>setTimeout(r,1200));

 for(let i=5;i>=0;i--){
  count.innerText=i;
  beep(300+i*50,.2);
  await new Promise(r=>setTimeout(r,700));
 }

 scare.style.display="flex";
 // Urlo sintetico, attivato dopo il tocco dell'utente.
 const ctx=new AudioContext();
 const o=ctx.createOscillator();
 const g=ctx.createGain();
 o.type="sawtooth";
 o.frequency.setValueAtTime(250,ctx.currentTime);
 o.frequency.exponentialRampToValueAtTime(1000,ctx.currentTime+.4);
 o.frequency.exponentialRampToValueAtTime(350,ctx.currentTime+1.2);
 g.gain.setValueAtTime(.001,ctx.currentTime);
 g.gain.linearRampToValueAtTime(.15,ctx.currentTime+.1);
 g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+1.3);
 o.connect(g);g.connect(ctx.destination);
 o.start();o.stop(ctx.currentTime+1.3);
 o.onended=()=>ctx.close();
};
</script>
</body>
</html>
